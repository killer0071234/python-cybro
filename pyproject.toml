[tool.poetry]
name = "cybro"
version = "0.4.1"
description = "Asynchronous Python client for the Cybro scgi server (v3.2.6 and newer)."
authors = ["Daniel Gangl <killer007@gmx.at>"]
maintainers = ["Daniel Gangl <killer007@gmx.at>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/killer0071234/python-cybro"
repository = "https://github.com/killer0071234/python-cybro"
documentation = "https://github.com/killer0071234/python-cybro"
keywords = ["cybro", "api", "async", "client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    { include = "cybro", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = ">=3.8.0"
yarl = ">=1.7.2"
backoff = ">=1.11.0"
cachetools = ">=5.0.0"
xmltodict = ">=0.13.0"

[tool.poetry.group.dev.dependencies]
aresponses = "^3.0.0"
codespell = "^2.2.6"
coverage = {version = "^7.4", extras = ["toml"]}
mypy = "^1.14"
pre-commit = "^3.5.0"
pytest = "^8.4.2"
pytest-asyncio = ">=0.23.6,<1.5.0"
pytest-cov = ">=5,<8"
ruff = "^0.16.10"
safety = "^3.2.14"
types-cachetools = ">=5.3,<8.0"
vulture = "^2.11"
yamllint = "^1.35.1"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/killer0071234/python-cybro/issues"
Changelog = "https://github.com/killer0071234/python-cybro/blob/main/CHANGELOG.md"

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.coverage.run]
branch = true
source = ["cybro"]

[tool.mypy]
# Specify the target platform details in config, so your developers are
# free to run mypy on Windows, Linux, or macOS and get consistent
# results.
platform = "linux"
python_version = 3.11

# flake8-mypy expects the two following for sensible formatting
show_column_numbers = true

# show error messages from unrelated files
follow_imports = "normal"

# suppress errors about unsatisfied imports
ignore_missing_imports = true

# be strict
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = false # thanks backoff :(
no_implicit_optional = true
no_implicit_reexport = true
strict_optional = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

# No incremental mode
cache_dir = "/dev/null"

[tool.pytest.ini_options]
addopts = " --cov=."

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "E",    # pycodestyle errors
  "ERA",  # eradicate (commented-out code)
  "F",    # pyflakes
  "I",    # isort
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "D202", # blank line after function docstring
  "E501", # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["cybro"]

[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
verbose = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
