[tool.poetry]
name = "cybro"
version = "1.1.0"
description = "Asynchronous Python client for Cybro PLCs: scgi server (v3.2.6 and newer) or direct A-bus/UDP."
authors = ["Daniel Gangl <killer007@gmx.at>"]
maintainers = ["Daniel Gangl <killer007@gmx.at>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/killer0071234/python-cybro"
repository = "https://github.com/killer0071234/python-cybro"
documentation = "https://github.com/killer0071234/python-cybro"
keywords = ["cybro", "hiq", "abus", "api", "async", "client"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    { include = "cybro", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = ">=3.8.0"
yarl = ">=1.7.2"
backoff = ">=1.11.0"
cachetools = ">=5.0.0"
xmltodict = ">=0.13.0"

[tool.poetry.group.dev.dependencies]
aresponses = "^3.0.0"
codespell = "^2.2.6"
coverage = {version = "^7.4", extras = ["toml"]}
pre-commit = ">=3.5,<5.0"
pytest = ">=8.4.2,<10.0.0"
pytest-asyncio = ">=0.23.6,<1.5.0"
pytest-cov = ">=5,<8"
ruff = ">=0.16.10,<0.18.0"
safety = "^3.2.14"
types-cachetools = ">=5.3,<8.0"
vulture = "^2.11"
yamllint = "^1.35.1"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/killer0071234/python-cybro/issues"
Changelog = "https://github.com/killer0071234/python-cybro/blob/main/CHANGELOG.md"

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.coverage.run]
branch = true
source = ["cybro"]

[tool.pytest.ini_options]
addopts = " --cov=."

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "E",    # pycodestyle errors
  "ERA",  # eradicate (commented-out code)
  "F",    # pyflakes
  "I",    # isort
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "D202", # blank line after function docstring
  "E501", # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/abus_probe.py" = ["S104", "S603", "S607"]  # CLI tool: binds 0.0.0.0, calls arp

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["cybro"]

[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
verbose = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
